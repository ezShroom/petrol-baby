name: Quality Check
run-name: Checking commit by ${{ github.actor }}

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  Style:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Style
        run: bun run style

  Check-Types:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

  Test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke test built server
        run: |
          mkdir -p /tmp/pb-smoke
          DATABASE_PATH=/tmp/pb-smoke/db.sqlite \
          FUEL_FINDER_CLIENT_ID=smoke FUEL_FINDER_CLIENT_SECRET=smoke \
          HOST=127.0.0.1 PORT=43117 ORIGIN=http://127.0.0.1:43117 \
          bun packages/web/build/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            sleep 0.5
            curl -sf http://127.0.0.1:43117/healthz && break
          done
          curl -sf http://127.0.0.1:43117/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:43117/readyz)" = "503"
          curl -sf -X POST http://127.0.0.1:43117/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q petrol-baby
          kill -TERM $SERVER_PID
          wait $SERVER_PID
